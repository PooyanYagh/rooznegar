<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>روزنگار</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>روزنگار</h1><button id="logout" hidden>خروج</button></header><section id="auth"><h2>ژورنال خصوصی شما</h2><p>با لینک ورود، یادداشت‌هایتان امن و بین دستگاه‌ها همگام می‌شوند.</p><input id="email" type="email" placeholder="ایمیل"><button id="login">ارسال لینک ورود</button></section><section id="app" hidden><div class="bar"><input id="date" type="date"><input id="score" type="range" min="1" max="10" value="5"><b id="scoreText">۵/۱۰</b></div><textarea id="highlight" placeholder="هایلایت امروز چیست؟"></textarea><h3>اتفاق‌های روز</h3><div id="events"></div><button id="add">+ اتفاق</button><textarea id="thoughts" placeholder="فکرها"></textarea><textarea id="dump" placeholder="Brain Dump — هر چه در ذهنت هست"></textarea><textarea id="lesson" placeholder="درس یا تنظیم بعدی"></textarea><button id="save">ذخیرهٔ امن</button><p id="status"></p><h3>روزهای گذشته</h3><div id="history"></div></section></main><script type="module" src="app.js"></script></body></html>
